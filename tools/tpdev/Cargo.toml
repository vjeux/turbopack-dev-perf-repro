[package]
name = "tpdev"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Turbopack dev-server performance reproducer: app generator, route probe and dev chunk analyzer"
publish = false

[dependencies]
memchr = "2"
regex = "1"
serde_json = "1"
ureq = { version = "2", default-features = false }

[profile.release]
opt-level = 3
debug = false
